<template>
  <div class="ruc-container">

    <template lwc:if={showIdle}>
      <!-- Header -->
      <div class="ruc-header">
        <h2 class="ruc-title">{value.title}</h2>
        <p class="ruc-subtitle">{value.subtitle}</p>
      </div>

      <!-- Drop zone -->
      <div class={dropZoneClass}
           ondragover={handleDragOver}
           ondragleave={handleDragLeave}
           ondrop={handleDrop}>
        <div class="ruc-drop-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 16V8M12 8L9 11M12 8L15 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 20H17C18.1046 20 19 19.1046 19 18V9.41421C19 9.149 18.8946 8.89464 18.7071 8.70711L15.2929 5.29289C15.1054 5.10536 14.851 5 14.5858 5H7C5.89543 5 5 5.89543 5 7V18C5 19.1046 5.89543 20 7 20Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="ruc-drop-primary">Drag &amp; drop your Business Licence here</p>
        <p class="ruc-drop-secondary">or</p>
        <label class="ruc-browse-btn">
          Browse Files
          <input type="file" class="ruc-file-input" accept=".pdf,.doc,.docx" onchange={handleFileChange} />
        </label>
        <p class="ruc-formats">Accepted: PDF, DOC, DOCX</p>
      </div>

      <!-- Selected file preview -->
      <template lwc:if={hasFile}>
        <div class="ruc-file-preview">
          <div class="ruc-file-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 20H17C18.1046 20 19 19.1046 19 18V9.41421C19 9.149 18.8946 8.89464 18.7071 8.70711L15.2929 5.29289C15.1054 5.10536 14.851 5 14.5858 5H7C5.89543 5 5 5.89543 5 7V18C5 19.1046 5.89543 20 7 20Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="ruc-file-info">
            <span class="ruc-file-name">{selectedFileName}</span>
            <span class="ruc-file-size">{selectedFileSize}</span>
          </div>
          <button class="ruc-file-remove" onclick={handleRemoveFile} title="Remove file">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </template>

      <!-- Error -->
      <template lwc:if={errorMessage}>
        <div class="ruc-error">{errorMessage}</div>
      </template>

      <!-- Submit -->
      <button class="ruc-submit" onclick={handleSubmit} disabled={submitDisabled}>
        {value.submitLabel}
      </button>
    </template>

    <!-- Processing state -->
    <template lwc:if={showProcessing}>
      <div class="ruc-status ruc-status--processing">
        <div class="ruc-spinner"></div>
        <p class="ruc-status-text">{processingMessage}</p>
      </div>
    </template>

    <!-- Success state -->
    <template lwc:if={showSuccess}>
      <div class="ruc-status ruc-status--success">
        <div class="ruc-success-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="ruc-status-text">{successMessage}</p>
      </div>
    </template>

    <!-- Error state -->
    <template lwc:if={showErrorState}>
      <div class="ruc-status ruc-status--error">
        <p class="ruc-status-text">{errorStateMessage}</p>
        <button class="ruc-retry-btn" onclick={handleRetry}>Try Again</button>
      </div>
    </template>

  </div>
</template>
